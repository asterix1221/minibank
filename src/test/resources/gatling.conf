gatling {
  data {
    # NOTE: "graphite" is intentionally not listed here. It was removed from Gatling in
    # 3.12 (dropped along with the Akka dependency), so there is no supported way to
    # stream live metrics out of an OSS run anymore (Enterprise-only feature now).
    # simulation.log itself (the "file" writer's output) is also an undocumented,
    # version-specific BINARY format as of this Gatling version - do not try to tail
    # it as text. Instead, load-testing/gatling_metrics_exporter.py polls the
    # official post-run JSON report files (target/gatling/<run>/js/global_stats.json
    # and js/stats.js) that Gatling writes once a run finishes, and exposes those as
    # Prometheus metrics. This means the Grafana "Gatling Load Test (custom)"
    # dashboard updates once per completed run, not continuously during the run.
    writers = [console, file]

    file {
      bufferSize = 8192
    }
  }
}
