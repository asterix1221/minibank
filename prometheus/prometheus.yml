global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mini-bank-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Stage 3: the Gatling load-test exporter. It runs on the host machine (see
  # load-testing/gatling_metrics_exporter.py), not as a compose service, so it's reached via
  # host.docker.internal (see the `extra_hosts` entry on the prometheus service in
  # docker-compose.yml - required for this to resolve on bare Docker Engine, not just Docker
  # Desktop). This target will show DOWN whenever no load test is currently running, since
  # nothing is listening on port 9302 then - that's expected, not a bug.
  - job_name: 'gatling'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9302']
